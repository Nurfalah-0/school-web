services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: lomba_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_smknuruljadid
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Auto-import database saat pertama kali dinyalakan (opsional)
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lomba_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: lomba_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend Laravel (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lomba_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - backend_storage:/var/www/storage
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: db_smknuruljadid
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lomba_backend_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - backend_storage:/var/www/storage
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: db_smknuruljadid
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Web Server khusus Backend Laravel API
  backend_nginx:
    image: nginx:alpine
    container_name: lomba_backend_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy

  # 4. Frontend Vue.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lomba_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend_nginx

volumes:
  dbdata:
  redisdata:
  backend_vendor:
  backend_storage: