apiVersion: v1
kind: Service
metadata:
  name: backend-jhic
  namespace: jhic-app
spec:
  selector:
    app: backend-jhic
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-jhic
  namespace: jhic-app
spec:
  selector:
    app: frontend-jhic
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
