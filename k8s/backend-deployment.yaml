apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-jhic
  namespace: jhic-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-jhic
  template:
    metadata:
      labels:
        app: backend-jhic
    spec:
      containers:
      - name: backend
        image: ${{ secrets.DOCKER_USERNAME }}/school-web-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
